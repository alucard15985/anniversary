<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Rincón Especial 🐈📜</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #2b262d; /* Fondo oscuro elegante */
      --paper-bg: #f7f1e3; /* Fondo estilo pergamino / papel antiguo */
      --ink-color: #2c2c54; /* Color tinta azul/negra */
      --accent-color: #d1ccc0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #fff;
      overflow-x: hidden;
    }

    /* Gatos Animados en Fondo */
    .cat-bg {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }
    .cat-corner { bottom: -10px; left: -10px; width: 90px; }

    /* Navegación por Capítulos */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
      z-index: 10;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #d1ccc0;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: #f7f1e3;
      color: var(--ink-color);
      font-weight: 600;
    }

    .tab-btn.locked {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Hoja de Pergamino / Manuscrito */
    .manuscript-container {
      position: relative;
      z-index: 5;
      max-width: 650px;
      width: 100%;
      background: var(--paper-bg);
      color: var(--ink-color);
      border-radius: 12px;
      padding: 40px 35px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 80px rgba(139, 69, 19, 0.15);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #e0d0b0;
    }

    .chapter { display: none; }
    .chapter.active { display: block; }

    /* Fuente de Manuscrito hecho a mano */
    h1, h2 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      color: #1b1464;
      margin-bottom: 15px;
      text-align: center;
    }

    .typewriter-text {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      line-height: 1.6;
      min-height: 120px;
      text-align: left;
      white-space: pre-wrap; /* Mantiene saltos de línea */
    }

    /* Cursor parpadeante como pluma */
    .cursor {
      display: inline-block;
      width: 3px;
      background-color: var(--ink-color);
      margin-left: 2px;
      animation: blink 0.7s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Tarjetas e Inputs dentro del Pergamino */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card-item {
      background: rgba(0,0,0,0.04);
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #b8e994;
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
    }

    .card-item:hover { background: rgba(0,0,0,0.08); transform: translateY(-3px); }

    .secret-box {
      margin-top: 20px;
      text-align: center;
    }

    .secret-input {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      padding: 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--ink-color);
      outline: none;
      text-align: center;
      width: 200px;
    }

    /* Botones de Manuscrito */
    .btn-next {
      background: var(--ink-color);
      color: #f7f1e3;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 25px;
      align-self: center;
      transition: all 0.3s;
    }

    .btn-next:hover { opacity: 0.9; transform: scale(1.03); }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      position: relative;
      min-height: 60px;
    }

    .btn-yes { background: #27ae60; color: white; }
    .btn-no { background: #7f8c8d; color: white; position: absolute; }

  </style>
</head>
<body>

  <!-- Gato Silueta Esquina -->
  <img src="https://openclipart.org/download/218116/Gato-silueta-2.svg" class="cat-bg cat-corner" alt="Gato">

  <!-- Navegación por Capítulos -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="goToChapter(1)">Inicio 📜</button>
    <button class="tab-btn" onclick="goToChapter(2)">Cap II</button>
    <button class="tab-btn" onclick="goToChapter(3)">Cap III</button>
    <button class="tab-btn" onclick="goToChapter(4)">Cap IV 🔒</button>
    <button class="tab-btn locked" id="tab5" onclick="goToChapter(5)">Cap V 🔒</button>
    <button class="tab-btn locked" id="tab6" onclick="goToChapter(6)">Cap VI 🔒</button>
    <button class="tab-btn locked" id="tab7" onclick="goToChapter(7)">Cierre 🎁</button>
  </div>

  <!-- Hoja de Pergamino -->
  <div class="manuscript-container">
    
    <!-- Capítulo 1 -->
    <div class="chapter active" id="cap1">
      <h1>Capítulo I: El Comienzo 🐾</h1>
      <div class="typewriter-text" id="text1"></div>
      <button class="btn-next" onclick="goToChapter(2)">Paso a la siguiente página ➔</button>
    </div>

    <!-- Capítulo 2 -->
    <div class="chapter" id="cap2">
      <h1>Capítulo II: El Tiempo ⌛</h1>
      <div class="typewriter-text" id="text2"></div>
      <button class="btn-next" onclick="goToChapter(3)">Continuar leyendo ➔</button>
    </div>

    <!-- Capítulo 3 -->
    <div class="chapter" id="cap3">
      <h1>Capítulo III: Fragmentos 📸</h1>
      <div class="typewriter-text" id="text3"></div>
      <div class="cards-grid" id="cardsGrid" style="display:none;">
        <div class="card-item" onclick="alert('🐾 Aquella primera cita inolvidable...')">Recuerdo I</div>
        <div class="card-item" onclick="alert('🐾 Esa risa que alegra cualquier día.')">Recuerdo II</div>
        <div class="card-item" onclick="alert('🐾 Un momento simple, pero perfecto.')">Recuerdo III</div>
      </div>
      <button class="btn-next" onclick="goToChapter(4)" style="margin-top:25px;">Siguiente capítulo ➔</button>
    </div>

    <!-- Capítulo 4 -->
    <div class="chapter" id="cap4">
      <h1>Capítulo IV: El Sello Secreto 🔐</h1>
      <div class="typewriter-text" id="text4"></div>
      <div class="secret-box" id="secretBox" style="display:none;">
        <input type="text" id="secretKey" class="secret-input" placeholder="Escribe aquí..." autocomplete="off">
        <br>
        <button class="btn-next" onclick="checkSecret()">Romper el sello 🔑</button>
      </div>
      <p id="errorMsg" style="color: #c0392b; font-family: 'Caveat'; font-size: 1.4rem; display: none; text-align:center; margin-top:10px;">¡Ese no es el sello secreto! Intenta de nuevo 🐱</p>
    </div>

    <!-- Capítulo 5 -->
    <div class="chapter" id="cap5">
      <h1>Capítulo V: Razones 💖</h1>
      <div class="typewriter-text" id="text5"></div>
      <button class="btn-next" onclick="goToChapter(6)">Siguiente página ➔</button>
    </div>

    <!-- Capítulo 6 -->
    <div class="chapter" id="cap6">
      <h1>Capítulo VI: La Carta 💌</h1>
      <div class="typewriter-text" id="text6"></div>
      <button class="btn-next" onclick="goToChapter(7)">Llegar al final 🎁</button>
    </div>

    <!-- Capítulo 7 -->
    <div class="chapter" id="cap7">
      <h1>Capítulo VII: La Pregunta 🌹</h1>
      <div class="typewriter-text" id="text7"></div>
      <div class="btn-group" id="questionGroup" style="display:none;">
        <button class="btn-next btn-yes" onclick="alert('¡Sabía que dirías que sí! ❤️ Prometo una cita inolvidable.')">¡SÍ, ACEPTO! 😍</button>
        <button class="btn-next btn-no" id="btnNo" onmouseover="moveNoButton()" onclick="moveNoButton()">No 🐱</button>
      </div>
    </div>

  </div>

  <audio id="meowSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_145b98a0d4.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Textos para la narración manuscrita
    const stories = {
      1: "Había una vez, un espacio pensado para guardar pequeños fragmentos de nuestra historia...\n\nMenos convencional, más sincero y con el toque exacto de nosotros. Bienvenido a nuestro pergamino digital.",
      2: "Dicen que el tiempo vuela, pero a tu lado no solo pasan los días: se construyen recuerdos.\n\nCada hora, cada risa y cada pequeño 'miau' compartido ha hecho que este camino valga la pena.",
      3: "Toca las notas guardadas en este pergamino para revelar fragmentos de nuestros mejores momentos:",
      4: "Para continuar leyendo las páginas restantes de este manuscrito, escribe nuestra palabra secreta de reconocimiento en caso de emergencias:",
      5: "Razones para quererte:\n\n• Por tu forma única de iluminar el día.\n• Por cómo escuchas siempre con paciencia.\n• Por tu complicidad y risas compartidas.\n• Por ser, simplemente, tú.",
      6: "Querida persona especial,\n\nQuería construir este manuscrito para recordarte lo mucho que significas para mí. Gracias por acompañarme, por cada detalle y por hacer que cada día sea único.\n\nCon todo mi cariño ❤️",
      7: "Y así llegamos a la última página de este capítulo...\n\n¿Aceptas tener una cita especial conmigo este fin de semana?"
    };

    let unlocked = false;
    let typingTimeout;

    // Efecto Narración Letra por Letra
    function typeWriter(text, elementId, speed = 35, callback = null) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      let i = 0;

      // Crear cursor
      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      function type() {
        if (i < text.length) {
          container.innerHTML = text.substring(0, i + 1);
          container.appendChild(cursor);
          i++;
          typingTimeout = setTimeout(type, speed);
        } else {
          if (callback) callback();
        }
      }
      type();
    }

    function goToChapter(num) {
      if (num > 4 && !unlocked) {
        alert("¡Debes resolver la clave del Capítulo IV para continuar! 🔒🐾");
        return;
      }

      clearTimeout(typingTimeout);

      // Cambiar visibilidad
      document.querySelectorAll('.chapter').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('cap' + num).classList.add('active');
      document.querySelectorAll('.tab-btn')[num - 1].classList.add('active');

      // Ocultar elementos interactivos secundarios antes de escribir
      if(num === 3) document.getElementById('cardsGrid').style.display = 'none';
      if(num === 4) document.getElementById('secretBox').style.display = 'none';
      if(num === 7) document.getElementById('questionGroup').style.display = 'none';

      // Iniciar efecto de escritura manuscrita
      typeWriter(stories[num], 'text' + num, 30, () => {
        // Mostrar elementos interactivos tras terminar de escribir
        if(num === 3) document.getElementById('cardsGrid').style.display = 'grid';
        if(num === 4) document.getElementById('secretBox').style.display = 'block';
        if(num === 7) document.getElementById('questionGroup').style.display = 'flex';
      });
    }

    function checkSecret() {
      const val = document.getElementById('secretKey').value.trim().toLowerCase();
      if (val === 'pulgoso') {
        unlocked = true;
        document.getElementById('errorMsg').style.display = 'none';
        
        document.querySelectorAll('.tab-btn').forEach((btn, index) => {
          if (index >= 4) btn.classList.remove('locked');
        });

        alert('¡Sello roto con éxito! Se han desbloqueado las páginas finales. 📜✨');
        goToChapter(5);
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    // Botón No Juguetón
    const meow = document.getElementById('meowSound');
    function moveNoButton() {
      meow.play().catch(() => {});
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 80);
      btnNo.style.position = 'fixed';
      btnNo.style.left = x + 'px';
      btnNo.style.top = y + 'px';
    }

    // Iniciar Capítulo 1 al cargar
    window.onload = () => {
      goToChapter(1);
    };
  </script>
</body>
</html>
