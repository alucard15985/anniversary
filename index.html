<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Rincón Especial 🐈📜❤️</title>
  <!-- Fuentes Opción 1: Dancing Script + Indie Flower -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Indie+Flower&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #1a1423; /* Fondo noche estrellada e íntimo */
      --paper-bg: #fbf7ee; /* Pergamino cálido */
      --ink-color: #2b1b17; /* Tinta borgoña/café profundo */
      --accent-color: #b33939; /* Rojo romántico sutil */
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(rgba(255, 215, 0, 0.08) 1px, transparent 0);
      background-size: 30px 30px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* --- SISTEMA DE GATOS ESPORÁDICOS --- */
    .random-cat {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      font-size: 2rem;
      opacity: 0;
      transition: all 1s ease-in-out;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .cat-appear {
      animation: popAndFade 4s ease-in-out forwards;
    }

    @keyframes popAndFade {
      0% { opacity: 0; transform: scale(0.5) translateY(10px); }
      20% { opacity: 0.9; transform: scale(1.1) translateY(0); }
      80% { opacity: 0.9; transform: scale(1) translateY(-10px); }
      100% { opacity: 0; transform: scale(0.8) translateY(-20px); }
    }

    /* --- NAVEGACIÓN Y ESTRUCTURA --- */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 700px;
      z-index: 10;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #e0d0b0;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--paper-bg);
      color: var(--ink-color);
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    .tab-btn.locked {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* --- PERGAMINO ROMÁNTICO --- */
    .manuscript-container {
      position: relative;
      z-index: 5;
      max-width: 650px;
      width: 100%;
      background: var(--paper-bg);
      color: var(--ink-color);
      border-radius: 16px;
      padding: 45px 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 90px rgba(139, 69, 19, 0.12), 0 0 20px rgba(255, 215, 0, 0.1);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #e2d1b0;
    }

    .chapter { display: none; }
    .chapter.active { display: block; }

    /* Títulos: Dancing Script */
    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 15px;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    /* Texto Narrativo: Indie Flower */
    .typewriter-text {
      font-family: 'Indie Flower', cursive;
      font-size: 1.65rem;
      line-height: 1.6;
      min-height: 140px;
      text-align: left;
      white-space: pre-wrap;
      color: var(--ink-color);
      letter-spacing: 0.5px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.4rem;
      background-color: var(--accent-color);
      margin-left: 3px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Elementos Interactivos */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card-item {
      background: rgba(179, 57, 57, 0.05);
      padding: 15px;
      border-radius: 10px;
      border: 1px dashed var(--accent-color);
      font-family: 'Indie Flower', cursive;
      font-size: 1.35rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s;
      color: var(--ink-color);
    }

    .card-item:hover { background: rgba(179, 57, 57, 0.12); transform: translateY(-3px); }

    .secret-box { margin-top: 20px; text-align: center; }

    .secret-input {
      font-family: 'Indie Flower', cursive;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent-color);
      outline: none;
      text-align: center;
      width: 220px;
      color: var(--ink-color);
    }

    /* Botones */
    .btn-next {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 25px;
      align-self: center;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(179, 57, 57, 0.3);
    }

    .btn-next:hover { opacity: 0.9; transform: scale(1.04); }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      position: relative;
      min-height: 60px;
    }

    .btn-yes { background: #27ae60; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
    .btn-no { background: #7f8c8d; position: absolute; }

  </style>
</head>
<body>

  <!-- Navegación -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="goToChapter(1)">Inicio 📜</button>
    <button class="tab-btn" onclick="goToChapter(2)">Cap II</button>
    <button class="tab-btn" onclick="goToChapter(3)">Cap III</button>
    <button class="tab-btn" onclick="goToChapter(4)">Cap IV 🔒</button>
    <button class="tab-btn locked" id="tab5" onclick="goToChapter(5)">Cap V 🔒</button>
    <button class="tab-btn locked" id="tab6" onclick="goToChapter(6)">Cap VI 🔒</button>
    <button class="tab-btn locked" id="tab7" onclick="goToChapter(7)">Cierre 🎁</button>
  </div>

  <!-- Manuscrito Pergamino -->
  <div class="manuscript-container">
    
    <!-- Capítulo 1 -->
    <div class="chapter active" id="cap1">
      <h1>Capítulo I: El Comienzo 🌹</h1>
      <div class="typewriter-text" id="text1"></div>
      <button class="btn-next" onclick="goToChapter(2)">Paso a la siguiente página ➔</button>
    </div>

    <!-- Capítulo 2 -->
    <div class="chapter" id="cap2">
      <h1>Capítulo II: El Tiempo ⏳</h1>
      <div class="typewriter-text" id="text2"></div>
      <button class="btn-next" onclick="goToChapter(3)">Continuar leyendo ➔</button>
    </div>

    <!-- Capítulo 3 -->
    <div class="chapter" id="cap3">
      <h1>Capítulo III: Fragmentos 📸</h1>
      <div class="typewriter-text" id="text3"></div>
      <div class="cards-grid" id="cardsGrid" style="display:none;">
        <div class="card-item" onclick="alert('🐾 Aquella primera cita inolvidable...')">Recuerdo I</div>
        <div class="card-item" onclick="alert('🐾 Esa risa que alegra cualquier día.')">Recuerdo II</div>
        <div class="card-item" onclick="alert('🐾 Un momento simple, pero perfecto.')">Recuerdo III</div>
      </div>
      <button class="btn-next" onclick="goToChapter(4)" style="margin-top:25px;">Siguiente capítulo ➔</button>
    </div>

    <!-- Capítulo 4 -->
    <div class="chapter" id="cap4">
      <h1>Capítulo IV: El Sello Secreto 🔐</h1>
      <div class="typewriter-text" id="text4"></div>
      <div class="secret-box" id="secretBox" style="display:none;">
        <input type="text" id="secretKey" class="secret-input" placeholder="Escribe la clave..." autocomplete="off">
        <br>
        <button class="btn-next" onclick="checkSecret()">Romper el sello 🔑</button>
      </div>
      <p id="errorMsg" style="color: #b33939; font-family: 'Indie Flower'; font-size: 1.4rem; display: none; text-align:center; margin-top:10px; font-weight:bold;">¡Ese no es el sello secreto! Intenta de nuevo 🐱</p>
    </div>

    <!-- Capítulo 5 -->
    <div class="chapter" id="cap5">
      <h1>Capítulo V: Razones 💖</h1>
      <div class="typewriter-text" id="text5"></div>
      <button class="btn-next" onclick="goToChapter(6)">Siguiente página ➔</button>
    </div>

    <!-- Capítulo 6 -->
    <div class="chapter" id="cap6">
      <h1>Capítulo VI: Carta Especial 💌</h1>
      <div class="typewriter-text" id="text6"></div>
      <button class="btn-next" onclick="goToChapter(7)">Llegar al final 🎁</button>
    </div>

    <!-- Capítulo 7 -->
    <div class="chapter" id="cap7">
      <h1>Capítulo VII: La Pregunta 🌹</h1>
      <div class="typewriter-text" id="text7"></div>
      <div class="btn-group" id="questionGroup" style="display:none;">
        <button class="btn-next btn-yes" onclick="alert('¡Sabía que dirías que sí! ❤️ Prometo una cita inolvidable.')">¡SÍ, ACEPTO! 😍</button>
        <button class="btn-next btn-no" id="btnNo" onmouseover="moveNoButton()" onclick="moveNoButton()">No 🐱</button>
      </div>
    </div>

  </div>

  <audio id="meowSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_145b98a0d4.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Historias
    const stories = {
      1: "Había una vez, un rincón creado únicamente para nosotros...\n\nUn pequeño libro digital para detener el tiempo y recordar lo bonito que es caminar juntos. Bienvenido a nuestras páginas.",
      2: "Dicen que el tiempo vuela cuando uno es feliz...\n\nPero contigo no solo pasan los minutos, se guardan miradas, risas compartidas y momentos que se quedan grabados para siempre.",
      3: "Toca suavemente cada nota guardada en este pergamino para revivir fragmentos de nuestra historia:",
      4: "Para abrir las páginas secretas que guardan lo más especial, escribe nuestra palabra secreta de reconocimiento:",
      5: "Razones para quererte cada día:\n\n• Por tu forma única de iluminar mis días.\n• Por tu paciencia y la calidez de tus abrazos.\n• Por cada risa, cada 'miau' y cada silencio cómodo.\n• Por ser, simplemente, mi persona favorita.",
      6: "Querida persona especial,\n\nQuería construir este manuscrito para recordarte lo infinitamente importante que eres para mí. Gracias por estar, por cuidar de nosotros y por hacer que la vida sea más bonita a tu lado.\n\nCon todo mi amor ❤️",
      7: "Y así llegamos a la última hoja de este capítulo...\n\n¿Aceptas tener una cita especial y mágica conmigo este fin de semana?"
    };

    // Colección de Gatitos de Distintos Colores
    const catIcons = ['🐈‍⬛', '🐈', '🐱', '🐾', '🖤', '🤍', '🤎'];

    let unlocked = false;
    let typingTimeout;

    // Escritura pausada: 60ms por carácter
    function typeWriter(text, elementId, speed = 60, callback = null) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      let i = 0;

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      function type() {
        if (i < text.length) {
          container.innerHTML = text.substring(0, i + 1);
          container.appendChild(cursor);
          i++;
          typingTimeout = setTimeout(type, speed);
        } else {
          if (callback) callback();
        }
      }
      type();
    }

    function goToChapter(num) {
      if (num > 4 && !unlocked) {
        alert("¡Debes resolver la clave del Capítulo IV para continuar! 🔒🐾");
        return;
      }

      clearTimeout(typingTimeout);

      document.querySelectorAll('.chapter').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('cap' + num).classList.add('active');
      document.querySelectorAll('.tab-btn')[num - 1].classList.add('active');

      if(num === 3) document.getElementById('cardsGrid').style.display = 'none';
      if(num === 4) document.getElementById('secretBox').style.display = 'none';
      if(num === 7) document.getElementById('questionGroup').style.display = 'none';

      typeWriter(stories[num], 'text' + num, 60, () => {
        if(num === 3) document.getElementById('cardsGrid').style.display = 'grid';
        if(num === 4) document.getElementById('secretBox').style.display = 'block';
        if(num === 7) document.getElementById('questionGroup').style.display = 'flex';
      });
    }

    function checkSecret() {
      const val = document.getElementById('secretKey').value.trim().toLowerCase();
      if (val === 'pulgoso') {
        unlocked = true;
        document.getElementById('errorMsg').style.display = 'none';
        
        document.querySelectorAll('.tab-btn').forEach((btn, index) => {
          if (index >= 4) btn.classList.remove('locked');
        });

        alert('¡Sello roto con éxito! Se han desbloqueado las páginas finales. 📜✨');
        goToChapter(5);
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    // Generador de Gatos Esporádicos
    function spawnRandomCat() {
      const cat = document.createElement('div');
      cat.className = 'random-cat cat-appear';
      
      const randomIcon = catIcons[Math.floor(Math.random() * catIcons.length)];
      cat.innerHTML = randomIcon + '💕';

      const posX = Math.random() * (window.innerWidth - 60);
      const posY = Math.random() * (window.innerHeight - 60);

      cat.style.left = posX + 'px';
      cat.style.top = posY + 'px';

      document.body.appendChild(cat);

      setTimeout(() => cat.remove(), 4000);
    }

    setInterval(() => {
      spawnRandomCat();
    }, Math.random() * 2500 + 3500);

    // Botón "No"
    const meow = document.getElementById('meowSound');
    function moveNoButton() {
      meow.play().catch(() => {});
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 80);
      btnNo.style.position = 'fixed';
      btnNo.style.left = x + 'px';
      btnNo.style.top = y + 'px';
    }

    window.onload = () => {
      goToChapter(1);
    };
  </script>
</body>
</html>
